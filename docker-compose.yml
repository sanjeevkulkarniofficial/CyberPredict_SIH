services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cyberpredict_backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build:
      context: ./cyberpredict-frontend
      dockerfile: Dockerfile
    container_name: cyberpredict_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend